<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff1de" />
    <title>Offline · 3D Kanban</title>
    <!-- The service worker's stand-in for a page when the office can't be reached (sw.js).
         Self-contained: it's shown with the network gone. It's served at the page's own address, so
         a reload is that page again. -->
    <script>try{var t=localStorage.getItem('agent-office.appearance');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <style>
      /* The shared tokens (themes/) are not loaded here, so the three looks' few values are set out as variables. */
      :root {
        color-scheme: light;
        --bg: #fffaf3; --card: #fff1de; --text: #2b2d42; --muted: #7a6f65; --line: #2b2d42;
        --btn: #ff8a5b; --btn-text: #fff; --bw: 3px; --radius: 16px; --radius-btn: 12px;
        --shadow: 0 4px 0 #2b2d42; --shadow-btn: 0 3px 0 #2b2d42; --shadow-pressed: 0 1px 0 #2b2d42; --press: 2px;
        --blur: none; --fw: 900;
        --font: 'Nunito', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #212121; --card: #2f2f2f; --text: #ececec; --muted: #b4b4b4; --line: rgba(255, 255, 255, .12);
        --btn: #ececec; --btn-text: #171717; --bw: 1px; --radius: 12px; --radius-btn: 999px;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-btn: 0 1px 2px rgba(0, 0, 0, .3); --shadow-pressed: none; --press: 0px;
        --fw: 600;
        --font: ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, sans-serif;
      }
      :root[data-theme="glossy"] {
        color-scheme: light;
        --bg: #f5f5f7; --card: rgba(255, 255, 255, .8); --text: #1d1d1f; --muted: #6e6e73; --line: rgba(0, 0, 0, .08);
        --btn: #0071e3; --btn-text: #fff; --bw: 1px; --radius: 14px; --radius-btn: 14px;
        --shadow: 0 1px 1px rgba(0, 0, 0, .04), 0 8px 24px rgba(0, 0, 0, .08); --shadow-btn: 0 1px 1px rgba(0, 0, 0, .04), 0 2px 6px rgba(0, 0, 0, .08);
        --shadow-pressed: 0 1px 1px rgba(0, 0, 0, .04); --press: 1px;
        --blur: saturate(180%) blur(20px); --fw: 600;
        --font: -apple-system, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', system-ui, sans-serif;
      }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; background: var(--bg); color: var(--text);
        font: 700 16px/1.4 var(--font);
      }
      .card { max-width: 360px; margin: 24px; padding: 28px 24px; text-align: center; background: var(--card); border: var(--bw) solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
      h1 { margin: 12px 0 6px; font-size: 20px; font-weight: var(--fw); }
      p { margin: 0 0 16px; color: var(--muted); }
      button { font: inherit; font-weight: var(--fw); padding: 8px 18px; color: var(--btn-text); background: var(--btn); border: var(--bw) solid var(--line); border-radius: var(--radius-btn); box-shadow: var(--shadow-btn); cursor: pointer; }
      button:active { transform: translateY(var(--press)); box-shadow: var(--shadow-pressed); }
      svg { width: 72px; height: 72px; }
    </style>
  </head>
  <body>
    <main class="card" role="status" aria-live="polite">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="30" width="52" height="8" rx="3" fill="#e0a96d"/><rect x="18" y="14" width="28" height="18" rx="3" fill="#2b2d42"/><rect x="21" y="17" width="22" height="12" rx="1" fill="#7cf29a"/><circle cx="32" cy="50" r="9" fill="#ff8a5b"/><circle cx="29" cy="48" r="1.8" fill="#222"/><circle cx="35" cy="48" r="1.8" fill="#222"/></svg>
      <h1>The office is offline. Reconnecting…</h1>
      <p id="say">Trying again in a few seconds.</p>
      <button id="now" type="button">Try now</button>
    </main>
    <script>
      (() => {
        const say = document.getElementById('say');
        let wait = 3;
        let timer;
        const retry = async () => {
          clearTimeout(timer);
          say.textContent = 'Trying…';
          try {
            const res = await fetch('/api/health', { cache: 'no-store' });
            if (res.ok) return location.reload();
          } catch {}
          wait = Math.min(wait * 2, 30);
          say.textContent = `Trying again in ${wait} seconds.`;
          timer = setTimeout(retry, wait * 1000);
        };
        document.getElementById('now').addEventListener('click', retry);
        addEventListener('online', retry);
        timer = setTimeout(retry, wait * 1000);
      })();
    </script>
  </body>
</html>
