<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff1de" />
    <title>Agent Office</title>
    <link rel="icon" href="/favicon.svg" />
    <!-- the PWA: manifest, icons, installed-app look; pwa.ts registers the service worker (docs/configuration.md#pwa). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="3D Kanban" />
    <link rel="stylesheet" href="./lite.css" />
  </head>
  <body class="lite">
    <!-- The 2D view (lite.ts): the office without the 3D, for a phone or a computer the 3D is too much for. -->
    <header class="lite-bar">
      <label class="lite-floor" title="The floor you're on: pick another to see its workers">
        <span class="lite-floor-label">Floor</span>
        <select id="floor" aria-label="Floor"></select>
      </label>
      <!-- the kanban view, on this floor's project (lite.ts keeps the link's floor). -->
      <a id="to-kanban" class="btn" href="/kanban" title="The kanban: tasks planned, built and reviewed by agents">🗂️ Kanban</a>
      <a id="to-3d" class="btn" href="/?3d=1" title="The 3D office, where you walk around">🏢 3D</a>
    </header>
    <main class="lite-main">
      <p id="floor-meta" class="lite-meta"></p>
      <div id="elsewhere" class="lite-elsewhere hidden"></div>
      <h2 class="lite-h">Workers <span id="waiting-now" class="lite-waiting"></span></h2>
      <ul id="workers" class="lite-workers"></ul>
    </main>
    <nav class="lite-nav" aria-label="Office">
      <button id="btn-issues" class="btn" type="button">📌 Issues <span class="n"></span></button>
      <button id="btn-pulls" class="btn" type="button">🔀 PRs <span class="n"></span></button>
      <button id="btn-queue" class="btn" type="button">📋 Queue <span class="n"></span></button>
      <button id="btn-new" class="btn primary" type="button">✨ New task</button>
    </nav>
    <div id="toasts"></div>
    <div id="conn" class="conn hidden">Reconnecting…</div>
    <div id="modal-root"></div>
    <script type="module" src="./lite.ts"></script>
    <!-- the PWA's service worker (pwa.ts). -->
    <script type="module" src="./pwa.ts"></script>
  </body>
</html>
